<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPHAH CENTRAL Rotator</title>

<link rel="stylesheet" href="https://saphahcentral.github.io/saphah/style-public.css">

<style>
  h2 {
    color: #FFD700;
    margin-bottom: 10px;
  }

  iframe {
    width: 100%;
    height: 600px;
    border: 2px solid #00FF00;
  }

  @media (max-width: 800px) {
    .top-table {
      display: block;
    }
    .top-left, .top-right {
      display: block;
      width: 100% !important;
      text-align:center !important;
    }
    .top-right div {
      transform-origin: top center !important;
      margin-top: 10px;
    }
  }
</style>

</head>

<body>

<!-- TOP DISPLAY SECTION -->
<div class="top-left" style="width:100%; text-align:left; vertical-align:top;">
  <a href="https://saphahcentral.github.io/dom6027/index.html" target="_blank">
    <img src="RECOMMENDS.png" alt="RECOMMENDS BANNER" style="max-width:95%; height:auto;">
  </a>
  <p style="color:red; font-size:14px; font-weight:bold; text-align:center; margin-top:5px;">
    Please scroll down for recommended site
  </p>
</div>

<hr />

<!-- Remove Frame Button -->
<a id="remove-frame" href="#" target="_blank">OPEN SITE IN NEW TAB</a>

<!-- Website Rotator -->
<iframe id="rotator-frame" src="" width="100%" height="600" style="border:none; overflow:auto;"></iframe>

<script>
// Detect referring domain
const source = document.referrer;
const sourceDomain = source ? new URL(source).hostname : "";

// =============================
// 🔴 HIGH PRIORITY (ENTRY / CONVERSION)
// =============================
let highPriority = [
  "https://saphahcentral.github.io/saphah/offer-create.html",
  "https://saphahcentral.github.io/saphah/offer-consult.html",
  "https://saphahcentral.github.io/saphah/offer-maintain.html",
  "https://saphahcentral.github.io/saphah/subscribe.html",
  "https://domg6027.github.io/dom6027/whatsapp-promo.html",
  "https://domg6027.github.io/bookshop/index.html",
  "https://saphahcentral.github.io/soar2024/bookshop.html",
  "https://saphahcentral.github.io/soar2024/salesrotator.html",
  "https://domg6027.github.io/dom6027/Truthseekers.html",
  "https://members.thetrafficplatform.com/free_website_traffic.asp?rid=10801",
  "https://www.thetrafficplatform.com/home.asp?rid=10801&p=1",
  "https://docs.google.com/document/d/1-7Q4TozRDERC0Til6c_2c_dvxSjN7bt8jWjEqCtPZZc/edit?usp=sharing"
];

// =============================
// 🟡 MEDIUM PRIORITY (Loaded from JSON)
// =============================
let mediumPriority = [];

// =============================
// 🟢 LOW PRIORITY (ARCHIVE / DEPTH)
// =============================
let lowPriority = [
  "https://saphahcentral.github.io/saphah/index.html",
  "https://domg6027.github.io/central/index.html",
  "https://domg6027.github.io/dows6027/index.html",
  "https://llpgpro.com/rtzsizzle/duck/"
];

// =============================
// FILTER OUT REFERRER
// =============================
function filterPages(arr) {
  return sourceDomain
    ? arr.filter(p => !p.includes(sourceDomain))
    : arr;
}

// =============================
// WEIGHTED SELECTION
// =============================
function pickGroup() {
  const rand = Math.random();

  if (rand < 0.6) return highPriority;
  if (rand < 0.9) return mediumPriority;
  return lowPriority;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// =============================
// START ROTATOR
// =============================
function startRotator() {

  highPriority = filterPages(highPriority);
  mediumPriority = filterPages(mediumPriority);
  lowPriority = filterPages(lowPriority);

  let selectedGroup;

  if (!localStorage.getItem("rotatorVisited")) {
    selectedGroup = highPriority;
    localStorage.setItem("rotatorVisited", "true");
  } else {
    selectedGroup = pickGroup();
  }

  if (!selectedGroup || selectedGroup.length === 0) {
    selectedGroup = [
      ...highPriority,
      ...mediumPriority,
      ...lowPriority
    ];
  }

  const randomPage = selectedGroup.length
    ? pickRandom(selectedGroup)
    : "https://domg6027.github.io/dom6027/index.html";

  document.getElementById("rotator-frame").src = randomPage;

  document.getElementById("remove-frame").onclick = function(e) {
    e.preventDefault();
    window.open(randomPage, "_blank");
  };
}

// =============================
// LOAD MEDIUM JSON
// =============================
fetch("https://saphahcentral.github.io/saphah/medium-sites.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Unable to load MEDIUM PRIORITY SITES list.");
    }
    return response.json();
  })
  .then(data => {
    mediumPriority = data;
    startRotator();
  })
  .catch(error => {
    console.warn("Medium list unavailable.", error);
    mediumPriority = [];
    startRotator();
  });
</script>
  
</body>
</html>
